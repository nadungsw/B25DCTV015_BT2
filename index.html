<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>May tinh don gian</title>
    <style>
        body {
            background-color: #e0e5ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        /* Khung máy tính*/
        .calculator {
            width: 300px;
            background-color: #2b2b2b; /* Màu vỏ máy */
            padding: 20px;
            border-radius: 20px;
            box-shadow: inset 0px 0px 5px #555, 0 15px 25px rgba(0,0,0,0.5);
            background-image: linear-gradient(145deg, #333, #1f1f1f);
        }
        .brand {
            color: white;
            font-size: 18px;
            font-weight: bold;
            font-style: italic;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        /* Màn LCD*/
        #display {
            background-color: #9ea79a; 
            color: #111;
            height: 70px;
            border-radius: 5px;
            font-size: 28px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            padding: 10px;
            margin-bottom: 25px;
            box-sizing: border-box;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            border: 2px solid #555;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            height: 55px;
            border-radius: 50px;
            border: none;
            background-color: #4a4a4a;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px #1a1a1a;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:active {
            box-shadow: 0 0 #1a1a1a;
            transform: translateY(4px);
        }
        .btn-operator {
            background-color: #383838;
        }
        .btn-clear {
            background-color: #c94c4c;
            grid-column: span 2; /* Chiếm 2 cột */
        }
        .btn-equal {
            background-color: #4b6cb7;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="brand">CASIO</div>
        
        <div id="display">0</div>
        
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="btn-operator">/</button>
            
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="btn-operator">*</button>
            
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="btn-operator">-</button>
            
            <button>0</button>
            <button>.</button>
            <button class="btn-equal">=</button>
            <button class="btn-operator">+</button>
            
            <button class="btn-clear">AC</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
