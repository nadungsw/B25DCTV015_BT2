<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính đơn giản</title>
    <style>
        .calculator {
            width: 250px;
            margin: 20px auto;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            font-family: Arial, sans-serif;
        }
        #display {
            height: 50px;
            background-color: #222;
            color: #0f0;
            text-align: right;
            padding: 10px;
            font-size: 24px;
            border-radius: 4px;
            margin-bottom: 15px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        .clear-btn {
            grid-column: span 4;
            background-color: #ff4c4c;
            color: white;
            border: none;
        }
        .clear-btn:hover {
            background-color: #ff1c1c;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- Màn hình hiển thị -->
        <div id="display">0</div>
        
        <!-- Các nút bấm -->
        <div class="buttons">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>
            
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>
            
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
            
            <button>0</button>
            <button>.</button>
            <button>=</button>
            <button>+</button>
            
            <button class="clear-btn">Clear</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('button');

        // Lắng nghe sự kiện click trên TẤT CẢ các nút bấm
        buttons.forEach(button => {
            button.addEventListener('click', function() {
                const value = this.innerText;

                if (value === 'Clear') {
                    // Đặt lại màn hình về 0
                    display.innerText = '0';
                } else if (value === '=') {
                    // Tính toán biểu thức
                    try {
                        display.innerText = eval(display.innerText);
                    } catch (error) {
                        display.innerText = 'Lỗi';
                    }
                } else {
                    // Nối số hoặc phép tính vào màn hình
                    if (display.innerText === '0' || display.innerText === 'Lỗi') {
                        display.innerText = value;
                    } else {
                        display.innerText += value;
                    }
                }
            });
        });
    </script>
</body>
</html>
